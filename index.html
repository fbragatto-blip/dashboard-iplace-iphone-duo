*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);

.fdiv:after{content:"";height:1px;background:var(--line);flex:1}

const STORES = DATA.stores;

document.getElementById('stBuild').textContent = DATA.meta.buildDt;
document.getElementById('p-all').textContent = STORES.length;
document.getElementById('p-apr').textContent = STORES.filter(s => s.prog === 'APR').length;
document.getElementById('p-t2').textContent = STORES.filter(s => s.prog !== 'APR').length;
document.getElementById('p-dc').textContent = STORES.length;

// Tab switcher
document.querySelectorAll('.tabs .tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs .tab').forEach(b => b.setAttribute('aria-selected', 'false'));
    document.querySelectorAll('section.panel').forEach(p => p.classList.remove('on'));
    btn.setAttribute('aria-selected', 'true');
    const k = btn.dataset.k;
    const p = document.getElementById('panel-' + k);
    if(p) p.classList.add('on');
  });
});

const PS_MAP = {
  0: { label: '0 · Não reportou', cls: 'nr', short: 'Sem report' },
  1: { label: '1 · Reportou c/ pendência', cls: 'pend', short: 'Pendente' },
  2: { label: '2 · OK 100%', cls: 'ok', short: 'OK 100%' }
};

const EL_MAP = {
  OK: { cls: 'ok', txt: 'OK' },
  PEND: { cls: 'pend', txt: 'PENDENTE' },
  NR: { cls: 'nr', txt: '—' },
  NA: { cls: 'na', txt: 'N/A' }
};

function pct(n, tot) {
  if (!tot) return '0%';
  return Math.round((n / tot) * 100) + '%';
}

function renderKPIs(stores, filterTot) {
  const tot = stores.length;
  const ok = stores.filter(s => s.ps === 2).length;
  const pend = stores.filter(s => s.ps === 1).length;
  const nr = stores.filter(s => s.ps === 0).length;
  const rep = ok + pend;
  const dcOn = stores.filter(s => s.dcota_online).length;

  return `
  <div class="kpi">
    <div class="n">${tot}</div>
    <div class="t">Lojas no filtro</div>
    <div class="t2">de ${filterTot} lojas iPlace</div>
  </div>
  <div class="kpi ok">
    <div class="n">${ok}</div>
    <div class="t">POS 2 · OK 100%</div>
    <div class="t2">${pct(ok, tot)} do filtro</div>
  </div>
  <div class="kpi pend">
    <div class="n">${pend}</div>
    <div class="t">POS 1 · C/ pendência</div>
    <div class="t2">${pct(pend, tot)} do filtro</div>
  </div>
  <div class="kpi nr">
    <div class="n">${nr}</div>
    <div class="t">POS 0 · Não reportou</div>
    <div class="t2">${pct(nr, tot)} do filtro</div>
  </div>
  <div class="kpi blue">
    <div class="n">${pct(rep, tot)}</div>
    <div class="t">Taxa de report</div>
    <div class="t2">${rep} de ${tot} lojas</div>
  </div>
  <div class="kpi ${dcOn > 0 ? 'ok' : ''}">
    <div class="n">${dcOn}</div>
    <div class="t">DCOTA Online</div>
    <div class="t2">${pct(dcOn, tot)} dos aparelhos</div>
  </div>
  `;
}

function renderElementsTable(stores) {
  const tot = stores.length;
  const repStores = stores.filter(s => s.ps > 0);
  const repTot = repStores.length;

  const elements = [
    { key: 'duo', label: 'iPhone Duo Demo' },
    { key: 'mat3d', label: '3D Materiais' }
  ];

  let rowsHtml = '';
  for (const el of elements) {
    const ok = repStores.filter(s => s.el[el.key] === 'OK').length;
    const p = repStores.filter(s => s.el[el.key] === 'PEND').length;
    const nr = tot - (ok + p);
    const pOk = pct(ok, repTot || 1);

    const wOk = pct(ok, tot);
    const wP = pct(p, tot);
    const wNr = pct(nr, tot);

    rowsHtml += `
    <tr>
      <td><b>${el.label}</b></td>
      <td class="n">${tot}</td>
      <td style="min-width:140px">
        <div class="bar">
          <i class="b-ok" style="width:${wOk}"></i>
          <i class="b-pend" style="width:${wP}"></i>
          <i class="b-nr" style="width:${wNr}"></i>
        </div>
      </td>
      <td class="n" style="color:var(--ok)">${ok}</td>
      <td class="n" style="color:var(--pend)">${p}</td>
      <td class="n" style="color:var(--nr)">${nr}</td>
      <td class="n"><b>${pOk}</b></td>
    </tr>
    `;
  }

  return `
  <div class="card">
    <h2>Visão por elemento <small>Consolidado · base = lojas que reportaram</small></h2>
    <div class="tblwrap">
      <table class="el">
        <thead>
          <tr>
            <th>Elemento</th>
            <th class="n">Lojas</th>
            <th>Progresso</th>
            <th class="n">OK</th>
            <th class="n">Pend.</th>
            <th class="n">S/ resp.</th>
            <th class="n">% OK</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  </div>
  `;
}

function renderRegionalSummary(stores) {
  const groups = {};
  for (const s of stores) {
    const k = s.regional || 'SEM REGIONAL';
    if (!groups[k]) groups[k] = { tot: 0, rep: 0, ok: 0, pend: 0, nr: 0 };
    groups[k].tot++;
    if (s.ps > 0) groups[k].rep++;
    if (s.ps === 2) groups[k].ok++;
    if (s.ps === 1) groups[k].pend++;
    if (s.ps === 0) groups[k].nr++;
  }

  const keys = Object.keys(groups).sort((a,b) => groups[b].tot - groups[a].tot);

  let rowsHtml = '';
  for (const k of keys) {
    const g = groups[k];
    const wOk = pct(g.ok, g.tot);
    const wP = pct(g.pend, g.tot);
    const wNr = pct(g.nr, g.tot);

    rowsHtml += `
    <tr>
      <td><b>${k}</b></td>
      <td class="c">${g.tot}</td>
      <td class="c" style="color:var(--ok);font-weight:700">${g.ok}</td>
      <td style="min-width:110px">
        <div class="bar">
          <i class="b-ok" style="width:${wOk}"></i>
          <i class="b-pend" style="width:${wP}"></i>
          <i class="b-nr" style="width:${wNr}"></i>
        </div>
      </td>
      <td class="c" style="color:var(--pend);font-weight:700">${g.pend > 0 ? g.pend : '—'}</td>
      <td class="c" style="color:var(--nr);font-weight:700">${g.nr > 0 ? g.nr : '—'}</td>
    </tr>
    `;
  }

  return `
  <div class="card">
    <h2>Visão por Regional iPlace <small>Distribuição e execução · respeita os filtros</small></h2>
    <div class="tblwrap">
      <table class="el">
        <thead>
          <tr>
            <th>Regional</th>
            <th class="c">Lojas</th>
            <th class="c">100% OK</th>
            <th>Progresso</th>
            <th class="c">Pendente</th>
            <th class="c">Sem Report</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  </div>
  `;
}

function renderStoresTable(stores, tableId) {
  let rowsHtml = '';
  for (const s of stores) {
    const psObj = PS_MAP[s.ps] || PS_MAP[0];
    const duoObj = EL_MAP[s.el.duo] || EL_MAP.NR;
    const matObj = EL_MAP[s.el.mat3d] || EL_MAP.NR;
    const progCls = (s.prog === 'APR') ? 'apr' : 'aar';

    const dcBadge = s.dcota_online
      ? `<span class="badge ok">🟢 Online</span>`
      : `<span class="badge na">⚪ Offline</span>`;

    rowsHtml += `
    <tr>
      <td><code>${s.id}</code></td>
      <td>
        <b>${s.name}</b><br>
        <span style="color:var(--ink2);font-size:11.5px">${s.city}${s.state ? ' / ' + s.state : ''}</span>
      </td>
      <td><span class="badge ${progCls}">${s.prog}</span></td>
      <td>
        <b>${s.regional}</b><br>
        <small style="color:var(--ink2)">TL: ${s.timeline}</small>
      </td>
      <td class="c"><span class="badge ${psObj.cls}">${psObj.label}</span></td>
      <td class="c"><span class="badge ${duoObj.cls}">${duoObj.txt}</span></td>
      <td class="c"><span class="badge ${matObj.cls}">${matObj.txt}</span></td>
      <td class="c">${dcBadge}</td>
      <td style="font-size:12px;color:var(--ink2);max-width:220px">
        ${s.pend ? `<b style="color:var(--pend)">${s.pend}</b><br>` : ''}
        ${s.comment ? `<em>${s.comment}</em>` : '—'}
      </td>
    </tr>
    `;
  }

  return `
  <div class="card">
    <h2>Lojas iPlace Detalhadas <small id="cnt-${tableId}">Mostrando ${stores.length} lojas</small></h2>
    <div class="tblwrap">
      <table class="lojas" id="${tableId}">
        <thead>
          <tr>
            <th>Apple ID</th>
            <th>Loja / Cidade</th>
            <th>Programa</th>
            <th>Regional / TL</th>
            <th class="c">POS Status</th>
            <th class="c">iPhone Duo Demo</th>
            <th class="c">3D Materiais</th>
            <th class="c">DCOTA</th>
            <th>Pendência / Obs</th>
          </tr>
        </thead>
        <tbody>
          ${rowsHtml || '<tr><td colspan="9" class="empty">Nenhuma loja encontrada para os filtros selecionados</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>
  `;
}

function mountPanel(panelId, initialStores, filterKey) {
  const panel = document.getElementById(panelId);
  if (!panel) return;

  const regionals = [...new Set(initialStores.map(s => s.regional))].filter(x => x && x !== 'SEM REGIONAL').sort();
  const timelines = [...new Set(initialStores.map(s => s.timeline))].filter(x => x && x !== 'SEM DEFINIÇÃO').sort();

  panel.innerHTML = `
  <div class="kpis" id="kpis-${filterKey}">
    ${renderKPIs(initialStores, STORES.length)}
  </div>

  <div class="grid-2col">
    ${renderRegionalSummary(initialStores)}
    ${renderElementsTable(initialStores)}
  </div>

  <div class="card">
    <h2>Filtros <small>Refine por regional, programa ou status</small></h2>
    <div class="body">
      <div class="fprimary">
        <div class="f">
          <label>Programa</label>
          <select id="f-prog-${filterKey}">
            <option value="">Todos os Programas</option>
            <option value="APR">Apple Premium Reseller (APR)</option>
            <option value="T2 MonoBrand">Tier 2 MonoBrand</option>
          </select>
        </div>
        <div class="f">
          <label>Regional</label>
          <select id="f-rm-${filterKey}">
            <option value="">Todas (${regionals.length})</option>
            ${regionals.map(r => `<option value="${r}">${r}</option>`).join('')}
          </select>
        </div>
        <div class="f">
          <label>POS Status</label>
          <select id="f-ps-${filterKey}">
            <option value="">Todos os Status</option>
            <option value="pend_all">⚠️ Todas as Pendências (0 + 1)</option>
            <option value="1">1 · Reportou c/ pendência</option>
            <option value="0">0 · Não reportou</option>
            <option value="2">2 · OK 100%</option>
          </select>
        </div>
        <div class="f">
          <label>DCOTA Online</label>
          <select id="f-dc-${filterKey}">
            <option value="">Todos</option>
            <option value="online">🟢 Online</option>
            <option value="offline">⚪ Offline</option>
          </select>
        </div>
      </div>

      <div class="fdiv"><span>Filtros Adicionais</span></div>

      <div class="fsecondary">
        <div class="f">
          <label>Data de Execução (Timeline)</label>
          <select id="f-tl-${filterKey}">
            <option value="">Todas (${timelines.length})</option>
            ${timelines.map(t => `<option value="${t}">${t}</option>`).join('')}
          </select>
        </div>
        <div class="f">
          <label>Buscar Loja, Cidade ou ID</label>
          <input type="search" id="f-search-${filterKey}" placeholder="Ex: Barra, Morumbi, 560581...">
        </div>
      </div>

      <div class="frow">
        <button class="btn" id="f-clear-${filterKey}">Limpar Filtros</button>
        <span class="count" id="f-count-${filterKey}"></span>
      </div>
    </div>
  </div>

  <div id="table-wrap-${filterKey}">
    ${renderStoresTable(initialStores, 'tbl-' + filterKey)}
  </div>
  `;

  function applyFilters() {
    let filtered = initialStores;

    const progVal = document.getElementById(`f-prog-${filterKey}`).value;
    if (progVal) filtered = filtered.filter(s => s.prog === progVal);

    const rmVal = document.getElementById(`f-rm-${filterKey}`).value;
    if (rmVal) filtered = filtered.filter(s => s.regional === rmVal);

    const psVal = document.getElementById(`f-ps-${filterKey}`).value;
    if (psVal === 'pend_all') {
      filtered = filtered.filter(s => s.ps === 0 || s.ps === 1);
    } else if (psVal !== '') {
      filtered = filtered.filter(s => String(s.ps) === psVal);
    }

    const dcVal = document.getElementById(`f-dc-${filterKey}`).value;
    if (dcVal === 'online') filtered = filtered.filter(s => s.dcota_online);
    if (dcVal === 'offline') filtered = filtered.filter(s => !s.dcota_online);

    const tlVal = document.getElementById(`f-tl-${filterKey}`).value;
    if (tlVal) filtered = filtered.filter(s => s.timeline === tlVal);

    const q = (document.getElementById(`f-search-${filterKey}`).value || '').trim().toLowerCase();
    if (q) {
      filtered = filtered.filter(s =>
        s.name.toLowerCase().includes(q) ||
        s.id.toLowerCase().includes(q) ||
        s.city.toLowerCase().includes(q) ||
        s.regional.toLowerCase().includes(q)
      );
    }

    document.getElementById(`kpis-${filterKey}`).innerHTML = renderKPIs(filtered, STORES.length);
    document.getElementById(`table-wrap-${filterKey}`).innerHTML = renderStoresTable(filtered, 'tbl-' + filterKey);
    document.getElementById(`f-count-${filterKey}`).innerHTML = `Filtradas <b>${filtered.length}</b> de ${initialStores.length} lojas`;
  }

  [`f-prog-${filterKey}`, `f-rm-${filterKey}`, `f-ps-${filterKey}`, `f-dc-${filterKey}`, `f-tl-${filterKey}`].forEach(id => {
    document.getElementById(id).addEventListener('change', applyFilters);
  });
  document.getElementById(`f-search-${filterKey}`).addEventListener('input', applyFilters);
  document.getElementById(`f-clear-${filterKey}`).addEventListener('click', () => {
    document.getElementById(`f-prog-${filterKey}`).value = '';
    document.getElementById(`f-rm-${filterKey}`).value = '';
    document.getElementById(`f-ps-${filterKey}`).value = '';
    document.getElementById(`f-dc-${filterKey}`).value = '';
    document.getElementById(`f-tl-${filterKey}`).value = '';
    document.getElementById(`f-search-${filterKey}`).value = '';
    applyFilters();
  });

  applyFilters();
}

// Mount panels
mountPanel('panel-all', STORES, 'all');
mountPanel('panel-apr', STORES.filter(s => s.prog === 'APR'), 'apr');
mountPanel('panel-t2', STORES.filter(s => s.prog !== 'APR'), 't2');
mountPanel('panel-dcota', STORES, 'dc');

</script>
</body>
</html>
