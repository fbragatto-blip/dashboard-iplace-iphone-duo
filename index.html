*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);

.wrap{max-width:1580px;margin:0 auto;padding:24px 20px 64px}

header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:0 0 4px}
.sub{color:var(--ink2);font-size:13px}
.stamp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);font-size:12px;line-height:1.6}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;font:inherit;font-weight:600;color:var(--ink2);

.tab .pill{display:inline-block;margin-left:8px;background:var(--nabg);color:var(--na);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700}

section.panel{display:none}
section.panel.on{display:block}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}

.kpi.ok .n{color:var(--ok)} .kpi.pend .n{color:var(--pend)} .kpi.nr .n{color:var(--nr)} .kpi.blue .n{color:var(--blue)}

.grid-2col{display:grid;grid-template-columns:1.15fr 0.85fr;gap:16px;margin-bottom:16px;align-items:start}
.grid-2col .card{margin-bottom:0}
@media(max-width:1200px){.grid-2col{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card>h2{margin:0;padding:13px 16px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line);

table.el, table.lojas{width:100%;border-collapse:collapse;font-size:13px}
table.el th,table.el td, table.lojas th, table.lojas td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}

// Tab switcher
document.querySelectorAll('.tabs .tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs .tab').forEach(b => b.setAttribute('aria-selected', 'false'));
    document.querySelectorAll('section.panel').forEach(p => p.classList.remove('on'));
    btn.setAttribute('aria-selected', 'true');
    const k = btn.dataset.k;
    const p = document.getElementById('panel-' + k);
    if(p) p.classList.add('on');

const PS_MAP = {
  0: { label: '0 · Não reportou', cls: 'nr', short: 'Sem report' },
  1: { label: '1 · Reportou c/ pendência', cls: 'pend', short: 'Pendente' },
  2: { label: '2 · OK 100%', cls: 'ok', short: 'OK 100%' }
};

const EL_MAP = {
  OK: { cls: 'ok', txt: 'OK' },
  PEND: { cls: 'pend', txt: 'PENDENTE' },
  NR: { cls: 'nr', txt: '—' },
  NA: { cls: 'na', txt: 'N/A' }
};

function pct(n, tot) {
  if (!tot) return '0%';
  return Math.round((n / tot) * 100) + '%';
}

function renderKPIs(stores, filterTot) {
  const tot = stores.length;
  const ok = stores.filter(s => s.ps === 2).length;
  const pend = stores.filter(s => s.ps === 1).length;
  const nr = stores.filter(s => s.ps === 0).length;
  const rep = ok + pend;
  const dcOn = stores.filter(s => s.dcota_online).length;

  return `
  <div class="kpi">
    <div class="n">${tot}</div>
    <div class="t">Lojas no filtro</div>
    <div class="t2">de ${filterTot} lojas iPlace</div>
  </div>
  <div class="kpi ok">
    <div class="n">${ok}</div>
    <div class="t">POS 2 · OK 100%</div>
    <div class="t2">${pct(ok, tot)} do filtro</div>
  </div>
  <div class="kpi pend">
    <div class="n">${pend}</div>
    <div class="t">POS 1 · C/ pendência</div>
    <div class="t2">${pct(pend, tot)} do filtro</div>
  </div>
  <div class="kpi nr">
    <div class="n">${nr}</div>
    <div class="t">POS 0 · Não reportou</div>
    <div class="t2">${pct(nr, tot)} do filtro</div>
  </div>
  <div class="kpi blue">
    <div class="n">${pct(rep, tot)}</div>
    <div class="t">Taxa de report</div>
    <div class="t2">${rep} de ${tot} lojas</div>
  </div>
  <div class="kpi ${dcOn > 0 ? 'ok' : ''}">
    <div class="n">${dcOn}</div>
    <div class="t">DCOTA Online</div>
    <div class="t2">${pct(dcOn, tot)} dos aparelhos</div>
  </div>
  `;
}

function renderElementsTable(stores) {
  const tot = stores.length;
  const repStores = stores.filter(s => s.ps > 0);
  const repTot = repStores.length;

  const elements = [
    { key: 'duo', label: 'iPhone Duo Demo' },
    { key: 'mat3d', label: '3D Materiais' }
  ];

  let rowsHtml = '';
  for (const el of elements) {
    const ok = repStores.filter(s => s.el[el.key] === 'OK').length;
    const p = repStores.filter(s => s.el[el.key] === 'PEND').length;
    const nr = tot - (ok + p);
    const pOk = pct(ok, repTot || 1);

    const wOk = pct(ok, tot);
    const wP = pct(p, tot);
    const wNr = pct(nr, tot);

    rowsHtml += `
    <tr>
      <td><b>${el.label}</b></td>
      <td class="n">${tot}</td>
      <td style="min-width:140px">
        <div class="bar">
          <i class="b-ok" style="width:${wOk}"></i>
          <i class="b-pend" style="width:${wP}"></i>
          <i class="b-nr" style="width:${wNr}"></i>
        </div>
      </td>
      <td class="n" style="color:var(--ok)">${ok}</td>
      <td class="n" style="color:var(--pend)">${p}</td>
      <td class="n" style="color:var(--nr)">${nr}</td>
      <td class="n"><b>${pOk}</b></td>
    </tr>
    `;
  }

  return `
  <div class="card">
    <h2>Visão por elemento <small>Consolidado · base = lojas que reportaram</small></h2>
    <div class="tblwrap">
      <table class="el">
        <thead>
          <tr>
            <th>Elemento</th>
            <th class="n">Lojas</th>
            <th>Progresso</th>
            <th class="n">OK</th>
            <th class="n">Pend.</th>
            <th class="n">S/ resp.</th>
            <th class="n">% OK</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  </div>
  `;
}

function renderRegionalSummary(stores) {
  const groups = {};
  for (const s of stores) {
    const k = s.regional || 'SEM REGIONAL';
    if (!groups[k]) groups[k] = { tot: 0, rep: 0, ok: 0, pend: 0, nr: 0 };
    groups[k].tot++;
    if (s.ps > 0) groups[k].rep++;
    if (s.ps === 2) groups[k].ok++;
    if (s.ps === 1) groups[k].pend++;
    if (s.ps === 0) groups[k].nr++;
  }

  const keys = Object.keys(groups).sort((a,b) => groups[b].tot - groups[a].tot);

  let rowsHtml = '';
  for (const k of keys) {
    const g = groups[k];
    const wOk = pct(g.ok, g.tot);
    const wP = pct(g.pend, g.tot);
    const wNr = pct(g.nr, g.tot);

    rowsHtml += `
    <tr>
      <td><b>${k}</b></td>
      <td class="c">${g.tot}</td>
      <td class="c" style="color:var(--ok);font-weight:700">${g.ok}</td>
      <td style="min-width:110px">
        <div class="bar">
          <i class="b-ok" style="width:${wOk}"></i>
          <i class="b-pend" style="width:${wP}"></i>
          <i class="b-nr" style="width:${wNr}"></i>
        </div>
      </td>
      <td class="c" style="color:var(--pend);font-weight:700">${g.pend > 0 ? g.pend : '—'}</td>
      <td class="c" style="color:var(--nr);font-weight:700">${g.nr > 0 ? g.nr : '—'}</td>
    </tr>
    `;
  }

  return `
  <div class="card">
    <h2>Visão por Regional iPlace <small>Distribuição e execução · respeita os filtros</small></h2>
    <div class="tblwrap">
      <table class="el">
        <thead>
          <tr>
            <th>Regional</th>
            <th class="c">Lojas</th>
            <th class="c">100% OK</th>
            <th>Progresso</th>
            <th class="c">Pendente</th>
            <th class="c">Sem Report</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  </div>
  `;
}

function renderStoresTable(stores, tableId) {
  let rowsHtml = '';
  for (const s of stores) {
    const psObj = PS_MAP[s.ps] || PS_MAP[0];
    const duoObj = EL_MAP[s.el.duo] || EL_MAP.NR;
    const matObj = EL_MAP[s.el.mat3d] || EL_MAP.NR;
    const progCls = (s.prog === 'APR') ? 'apr' : 'aar';

    const dcBadge = s.dcota_online
      ? `<span class="badge ok">🟢 Online</span>`
      : `<span class="badge na">⚪ Offline</span>`;

    rowsHtml += `
    <tr>
      <td><code>${s.id}</code></td>
      <td>
        <b>${s.name}</b><br>
        <span style="color:var(--ink2);font-size:11.5px">${s.city}${s.state ? ' / ' + s.state : ''}</span>
      </td>
      <td><span class="badge ${progCls}">${s.prog}</span></td>
      <td>
        <b>${s.regional}</b><br>
        <small style="color:var(--ink2)">TL: ${s.timeline}</small>
      </td>
      <td class="c"><span class="badge ${psObj.cls}">${psObj.label}</span></td>
      <td class="c"><span class="badge ${duoObj.cls}">${duoObj.txt}</span></td>
      <td class="c"><span class="badge ${matObj.cls}">${matObj.txt}</span></td>
      <td class="c">${dcBadge}</td>
      <td style="font-size:12px;color:var(--ink2);max-width:220px">
        ${s.pend ? `<b style="color:var(--pend)">${s.pend}</b><br>` : ''}
        ${s.comment ? `<em>${s.comment}</em>` : '—'}
      </td>
    </tr>
    `;
  }

  return `
  <div class="card">
    <h2>Lojas iPlace Detalhadas <small id="cnt-${tableId}">Mostrando ${stores.length} lojas</small></h2>
    <div class="tblwrap">
      <table class="lojas" id="${tableId}">
        <thead>
          <tr>
            <th>Apple ID</th>
            <th>Loja / Cidade</th>
            <th>Programa</th>
            <th>Regional / TL</th>
            <th class="c">POS Status</th>
            <th class="c">iPhone Duo Demo</th>
            <th class="c">3D Materiais</th>
            <th class="c">DCOTA</th>
            <th>Pendência / Obs</th>
          </tr>
        </thead>
        <tbody>
          ${rowsHtml || '<tr><td colspan="9" class="empty">Nenhuma loja encontrada para os filtros selecionados</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>
  `;
}

function mountPanel(panelId, initialStores, filterKey) {
  const panel = document.getElementById(panelId);
  if (!panel) return;

  const regionals = [...new Set(initialStores.map(s => s.regional))].filter(x => x && x !== 'SEM REGIONAL').sort();
  const timelines = [...new Set(initialStores.map(s => s.timeline))].filter(x => x && x !== 'SEM DEFINIÇÃO').sort();

  panel.innerHTML = `
  <div class="kpis" id="kpis-${filterKey}">
    ${renderKPIs(initialStores, STORES.length)}
  </div>

  <div class="grid-2col">
    ${renderRegionalSummary(initialStores)}
    ${renderElementsTable(initialStores)}
  </div>

  <div class="card">
    <h2>Filtros <small>Refine por regional, programa ou status</small></h2>
    <div class="body">
      <div class="fprimary">
        <div class="f">
          <label>Programa</label>
          <select id="f-prog-${filterKey}">
            <option value="">Todos os Programas</option>
            <option value="APR">Apple Premium Reseller (APR)</option>
            <option value="T2 MonoBrand">Tier 2 MonoBrand</option>
          </select>
        </div>
        <div class="f">
          <label>Regional</label>
          <select id="f-rm-${filterKey}">
            <option value="">Todas (${regionals.length})</option>
            ${regionals.map(r => `<option value="${r}">${r}</option>`).join('')}
          </select>
        </div>
        <div class="f">
          <label>POS Status</label>
          <select id="f-ps-${filterKey}">
            <option value="">Todos os Status</option>
            <option value="pend_all">⚠️ Todas as Pendências (0 + 1)</option>
            <option value="1">1 · Reportou c/ pendência</option>
            <option value="0">0 · Não reportou</option>
            <option value="2">2 · OK 100%</option>
          </select>
        </div>
        <div class="f">
          <label>DCOTA Online</label>
          <select id="f-dc-${filterKey}">
            <option value="">Todos</option>
            <option value="online">🟢 Online</option>
            <option value="offline">⚪ Offline</option>
          </select>
        </div>
      </div>

      <div class="fdiv"><span>Filtros Adicionais</span></div>

      <div class="fsecondary">
        <div class="f">
          <label>Data de Execução (Timeline)</label>
          <select id="f-tl-${filterKey}">
            <option value="">Todas (${timelines.length})</option>
            ${timelines.map(t => `<option value="${t}">${t}</option>`).join('')}
          </select>
        </div>
        <div class="f">
          <label>Buscar Loja, Cidade ou ID</label>
          <input type="search" id="f-search-${filterKey}" placeholder="Ex: Barra, Morumbi, 560581...">
        </div>
      </div>

      <div class="frow">
        <button class="btn" id="f-clear-${filterKey}">Limpar Filtros</button>
        <span class="count" id="f-count-${filterKey}"></span>
      </div>
    </div>
  </div>

  <div id="table-wrap-${filterKey}">
    ${renderStoresTable(initialStores, 'tbl-' + filterKey)}
  </div>
  `;

  function applyFilters() {
    let filtered = initialStores;

    const progVal = document.getElementById(`f-prog-${filterKey}`).value;
    if (progVal) filtered = filtered.filter(s => s.prog === progVal);

    const rmVal = document.getElementById(`f-rm-${filterKey}`).value;
    if (rmVal) filtered = filtered.filter(s => s.regional === rmVal);

    const psVal = document.getElementById(`f-ps-${filterKey}`).value;
    if (psVal === 'pend_all') {
      filtered = filtered.filter(s => s.ps === 0 || s.ps === 1);
    } else if (psVal !== '') {
      filtered = filtered.filter(s => String(s.ps) === psVal);
    }

    const dcVal = document.getElementById(`f-dc-${filterKey}`).value;
    if (dcVal === 'online') filtered = filtered.filter(s => s.dcota_online);
    if (dcVal === 'offline') filtered = filtered.filter(s => !s.dcota_online);

    const tlVal = document.getElementById(`f-tl-${filterKey}`).value;
    if (tlVal) filtered = filtered.filter(s => s.timeline === tlVal);

    const q = (document.getElementById(`f-search-${filterKey}`).value || '').trim().toLowerCase();
    if (q) {
      filtered = filtered.filter(s =>
        s.name.toLowerCase().includes(q) ||
        s.id.toLowerCase().includes(q) ||
        s.city.toLowerCase().includes(q) ||
        s.regional.toLowerCase().includes(q)
      );
    }

    document.getElementById(`kpis-${filterKey}`).innerHTML = renderKPIs(filtered, STORES.length);
    document.getElementById(`table-wrap-${filterKey}`).innerHTML = renderStoresTable(filtered, 'tbl-' + filterKey);
    document.getElementById(`f-count-${filterKey}`).innerHTML = `Filtradas <b>${filtered.length}</b> de ${initialStores.length} lojas`;
  }

  [`f-prog-${filterKey}`, `f-rm-${filterKey}`, `f-ps-${filterKey}`, `f-dc-${filterKey}`, `f-tl-${filterKey}`].forEach(id => {
    document.getElementById(id).addEventListener('change', applyFilters);
  });
  document.getElementById(`f-search-${filterKey}`).addEventListener('input', applyFilters);
  document.getElementById(`f-clear-${filterKey}`).addEventListener('click', () => {
    document.getElementById(`f-prog-${filterKey}`).value = '';
    document.getElementById(`f-rm-${filterKey}`).value = '';
    document.getElementById(`f-ps-${filterKey}`).value = '';
    document.getElementById(`f-dc-${filterKey}`).value = '';
    document.getElementById(`f-tl-${filterKey}`).value = '';
    document.getElementById(`f-search-${filterKey}`).value = '';
    applyFilters();
  });

  applyFilters();
}

// ---- Multi-seleção: cada <select> de filtro vira lista de checkboxes (vários valores por filtro)
function vals(id){
  const el = document.getElementById(id); if(!el) return [];
  let v = [...el.selectedOptions].map(o => o.value).filter(Boolean);
  if (v.includes('pend_all')) v = [...new Set(v.filter(x => x !== 'pend_all').concat(['0','1']))];
  return v;
}
function makeMulti(sel){
  const first = sel.options[0];
  const allLbl = (first && first.value === '') ? first.text : 'Todos';
  if (first && first.value === '') first.remove();
  sel.multiple = true; [...sel.options].forEach(o => o.selected = false); sel.style.display = 'none';
  const w = document.createElement('div'); w.className = 'ms';
  w.innerHTML = `<button type="button" class="ms-btn"></button><div class="ms-pop">
    <div class="ms-act"><a data-a="all">Selecionar todos</a> · <a data-a="none">Limpar</a></div>
    ${[...sel.options].map((o,i) => `<label><input type="checkbox" data-i="${i}"> ${o.text}</label>`).join('')}</div>`;
  sel.after(w);
  const btn = w.querySelector('.ms-btn'), cbs = [...w.querySelectorAll('input')];
  const label = () => { const on = [...sel.selectedOptions];
    btn.textContent = !on.length ? allLbl : on.length === 1 ? on[0].text : `${on.length} selecionados`;
    btn.title = on.map(o => o.text).join(', '); btn.classList.toggle('on', on.length > 0); };
  sel._msSync = () => { cbs.forEach(cb => cb.checked = sel.options[cb.dataset.i].selected); label(); };
  const fire = () => { label(); sel.dispatchEvent(new Event('change')); };
  cbs.forEach(cb => cb.addEventListener('change', () => { sel.options[cb.dataset.i].selected = cb.checked; fire(); }));
  w.querySelectorAll('.ms-act a').forEach(a => a.addEventListener('click', () => {
    const on = a.dataset.a === 'all'; [...sel.options].forEach(o => o.selected = on); sel._msSync(); fire(); }));
  btn.addEventListener('click', e => { e.stopPropagation();
    document.querySelectorAll('.ms.open').forEach(m => m !== w && m.classList.remove('open')); w.classList.toggle('open'); });
  w.querySelector('.ms-pop').addEventListener('click', e => e.stopPropagation());
  label();
}
document.addEventListener('click', () => document.querySelectorAll('.ms.open').forEach(m => m.classList.remove('open')));


// ---- Aba DCOTA com filtros (seleção múltipla) — mesma função nos dois reportes
function mountDcota(panel, stores, cfg) {
  if (!panel) return;
  const uniq = fn => [...new Set(stores.map(fn))].filter(Boolean).sort();
  const sel = fl => `<div class="f"><label>${fl.label}</label><select id="f-${fl.k}-dc"><option value="">Todos</option>${
    (fl.opts || uniq(fl.fn).map(v => [v, v])).map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select></div>`;
  panel.innerHTML = `
  <div class="kpis" id="kpis-dc"></div>
  <div class="card fcard">
    <h2>Filtros DCOTA <small>Seleção múltipla · combine os filtros</small></h2>
    <div class="body">
      <div class="fprimary">${cfg.filters.map(sel).join('')}
        <div class="f"><label>Buscar Loja, Cidade, ID ou Serial</label>
          <input type="search" id="f-search-dc" placeholder="Ex: Barra, 560581, K2J7..."></div>
      </div>
      <div class="frow"><button class="btn" id="f-clear-dc">Limpar Filtros</button><span class="count" id="f-count-dc"></span></div>
    </div>
  </div>
  <div id="dc-dev-wrap"></div>
  <div id="dc-stores-wrap"></div>`;

  const apply = () => {
    let f = stores;
    for (const fl of cfg.filters) {
      const v = vals(`f-${fl.k}-dc`);
      if (v.length) f = f.filter(s => v.includes(String(fl.fn(s))));
    }
    const q = (document.getElementById('f-search-dc').value || '').trim().toLowerCase();
    if (q) f = f.filter(s => [s.name, s.id, s.city, ...(s.dcota_devs || []).map(d => d.sn)]
                               .some(x => String(x || '').toLowerCase().includes(q)));
    const on = f.filter(s => s.dcota_online);
    const devs = on.reduce((n, s) => n + (s.dcota_count || 0), 0);

    document.getElementById('kpis-dc').innerHTML = `
      <div class="kpi"><div class="n">${f.length}</div><div class="t">Lojas no filtro</div><div class="t2">de ${stores.length} lojas monitoradas</div></div>
      <div class="kpi ok"><div class="n">${on.length}</div><div class="t">Lojas c/ iPhone Duo Online</div><div class="t2">${pct(on.length, f.length)} das lojas do filtro</div></div>
      <div class="kpi pend"><div class="n">${f.length - on.length}</div><div class="t">Aguardando Conexão</div><div class="t2">sem iPhone Duo online no DCOTA</div></div>
      <div class="kpi blue"><div class="n">${devs}</div><div class="t">Devices iPhone Duo Online</div><div class="t2">aparelhos conectados no filtro</div></div>`;

    // ---- Resumo gráfico: Reporte no Tracker × lojas conectadas no DCOTA
    const [G1, G2] = cfg.groups;
    const agg = l => { const o = {tot: l.length, ok: 0, pend: 0, nr: 0, on: 0};
      for (const s of l) { s.ps === 2 ? o.ok++ : s.ps === 1 ? o.pend++ : o.nr++; if (s.dcota_online) o.on++; } return o; };
    const cells = a => `
      <td class="c">${a.tot}</td>
      <td><div class="bar" title="OK ${a.ok} · Pendente ${a.pend} · Sem report ${a.nr}">
        <i class="b-ok" style="width:${pct(a.ok, a.tot)}"></i><i class="b-pend" style="width:${pct(a.pend, a.tot)}"></i><i class="b-nr" style="width:${pct(a.nr, a.tot)}"></i></div></td>
      <td class="c"><b>${a.ok + a.pend}</b> <small style="color:var(--ink2)">${pct(a.ok + a.pend, a.tot)}</small></td>
      <td><div class="bar" title="${a.on} de ${a.tot} lojas com iPhone Duo online"><i style="width:${pct(a.on, a.tot)};background:var(--blue)"></i></div></td>
      <td class="c"><b>${a.on}</b> <small style="color:var(--ink2)">${pct(a.on, a.tot)}</small></td>`;
    // ordem fixa (cfg) primeiro; o restante por nº de lojas
    const by = (l, fn, ord = []) => { const m = {}; for (const s of l) (m[fn(s) || '—'] ||= []).push(s);
      const r = k => { const i = ord.indexOf(k); return i < 0 ? 999 : i; };
      return Object.entries(m).sort((x, y) => r(x[0]) - r(y[0]) || y[1].length - x[1].length || x[0].localeCompare(y[0])); };
    const SUB = 'style="background:color-mix(in srgb,var(--blue) 6%,transparent)"';
    let sum = '';
    for (const [k1, l1] of by(f, G1.fn, G1.order)) {
      if (!G2) { sum += `<tr><td><b>${k1}</b></td>${cells(agg(l1))}</tr>`; continue; }
      const sub = by(l1, G2.fn, G2.order), span = sub.length + (sub.length > 1 ? 1 : 0);
      sub.forEach(([k2, l2], i) => { sum += `<tr>${i === 0 ? `<td rowspan="${span}" style="vertical-align:top"><b>${k1}</b></td>` : ''}<td>${k2}</td>${cells(agg(l2))}</tr>`; });
      if (sub.length > 1) sum += `<tr ${SUB}><td><b>Total ${k1}</b></td>${cells(agg(l1))}</tr>`;
    }
    if (f.length) sum += `<tr ${SUB}><td colspan="${G2 ? 2 : 1}"><b>Total</b></td>${cells(agg(f))}</tr>`;
    document.getElementById('dc-dev-wrap').innerHTML = `
      <div class="card">
        <h2>Resumo por ${G1.lbl}${G2 ? ' e ' + G2.lbl : ''} <small>Reporte no NPI Tracker × lojas com iPhone Duo conectado no DCOTA · respeita os filtros</small></h2>
        <div class="tblwrap"><table class="lojas">
          <thead><tr><th>${G1.lbl}</th>${G2 ? `<th>${G2.lbl}</th>` : ''}<th class="c">Lojas</th><th style="min-width:140px">Reporte Tracker</th>
            <th class="c">Reportaram</th><th style="min-width:140px">DCOTA</th><th class="c">Conectadas</th></tr></thead>
          <tbody>${sum || '<tr><td colspan="${G2 ? 7 : 6}" class="empty">Nenhuma loja para os filtros selecionados</td></tr>'}</tbody>
        </table></div>
        <div class="fx">
          <span class="sw" style="background:var(--ok)"></span>OK 100% ·
          <span class="sw" style="background:#e8912d"></span>reportou c/ pendência ·
          <span class="sw" style="background:#d9584f"></span>sem report &nbsp;|&nbsp;
          <span class="sw" style="background:var(--blue)"></span>loja com iPhone Duo online · Fonte: <code>Brazil_DCOTA_Devices.xlsx</code> (Box)
        </div>
      </div>`;
    document.getElementById('dc-stores-wrap').innerHTML = cfg.table([...f].sort((a, b) => b.dcota_online - a.dcota_online));
    document.getElementById('f-count-dc').innerHTML = `Filtradas <b>${f.length}</b> de ${stores.length} lojas`;
  };

  panel.querySelectorAll('.fcard select').forEach(makeMulti);
  panel.querySelectorAll('.fcard select').forEach(s => s.addEventListener('change', apply));
  document.getElementById('f-search-dc').addEventListener('input', apply);
  document.getElementById('f-clear-dc').addEventListener('click', () => {
    document.getElementById('f-search-dc').value = '';
    panel.querySelectorAll('.fcard select').forEach(sl => { [...sl.options].forEach(o => o.selected = false); sl._msSync && sl._msSync(); });
    apply();
  });
  apply();
}

// Mount panels
mountPanel('panel-all', STORES, 'all');
mountPanel('panel-apr', STORES.filter(s => s.prog === 'APR'), 'apr');
mountPanel('panel-t2', STORES.filter(s => s.prog !== 'APR'), 't2');
mountDcota(document.getElementById('panel-dcota'), STORES, {
  groups: [{lbl:'Regional', fn: s => s.regional}],
  table: f => renderStoresTable(f, 'tbl-dc'),
  filters: [
    {k:'prog', label:'Programa', fn: s => s.prog},
    {k:'reg',  label:'Regional', fn: s => s.regional},
    {k:'dcs', label:'Status DCOTA', fn: s => s.dcota_online ? 'online' : 'offline', opts:[['online','🟢 Online'],['offline','⚪ Offline']]},
    {k:'ps', label:'POS Status (Tracker)', fn: s => s.ps, opts:[['2','2 · OK 100%'],['1','1 · Reportou c/ pendência'],['0','0 · Não reportou']]},
  ]});

</script>
